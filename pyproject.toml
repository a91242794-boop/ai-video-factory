[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-video-factory"
version = "0.1.0"
description = "Deterministic six-shot AI video storyboard prompt pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
]

[project.scripts]
avf = "avf.cli:main"

[tool.setuptools.packages.find]
include = ["avf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
