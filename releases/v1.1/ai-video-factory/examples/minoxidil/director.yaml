campaign_concept: "从镜中焦虑到建立每日头皮护理习惯"
audience_insight: "用户首先被可见稀疏和自信变化触发，随后需要简单、可信、低门槛的使用展示。"
hook: "镜中拨开发际线，发现头发看起来更稀疏。"
emotional_arc: "发现问题 → 焦虑 → 找到简单方案 → 建立护理感 → 恢复自信"
visual_strategy: "真实墨西哥男性UGC开场，产品与使用过程采用高端商业微距。"
cta: "Descubre tu rutina de cuidado capilar"
shot_plan:
  - "镜中检查发际线"
  - "手指拨开稀疏区域"
  - "梳子上出现掉落发丝"
  - "人物短暂失落"
  - "产品在洗手台进入画面"
  - "拿起并观察包装"
  - "打开盖子展示膏体"
  - "在头皮分缝处点涂"
  - "指腹按摩"
  - "头皮护理的抽象微观视觉"
  - "角蛋白与护理成分视觉化"
  - "轻盈不油腻的使用感"
  - "完成晨间整理"
  - "镜中表情变得自信"
  - "产品与头发质感英雄镜头"
  - "白底产品CTA画面"
